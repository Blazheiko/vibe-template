# Local services for development: PostgreSQL with pgvector, Redis, SeaweedFS (S3) and Mailpit (SMTP),
# and, under the `app` profile, the application itself.
#
# Services only; the backend and frontend run on the host (`pnpm dev`):
#   pnpm services:up      # docker compose --env-file packages/backend/.env up -d --wait
#   pnpm services:down    # stop everything, keep the data
#   docker compose down -v  # stop and delete the volumes
#
# The whole application in containers, as built for production (backend serves the SPA):
#   pnpm app:build        # scripts/docker-build.sh: the local image vibe-template:local
#   pnpm app:up           # services + migrate (db:create, db:migrate) + app on http://localhost:3000
#   pnpm app:seed         # optional: reference data and the demo accounts (SEED_* in .env)
#
# Stop `pnpm dev` first, or set APP_PORT: both use port 3000.
#
# Credentials and host ports come from packages/backend/.env (the same PGSQL_*, REDIS_*, S3_*
# variables the backend reads), so both sides always agree. Without a value the defaults below
# match packages/backend/.env.example. Host ports: PGSQL_PORT, REDIS_PORT, S3_HOST_PORT (8333),
# SMTP_PORT (1025), MAILPIT_UI_PORT (8025), APP_PORT (3000). Every port is bound to 127.0.0.1:
# these are dev credentials, not for a shared network. Not for production; see
# documentation/backend/deployment.md.

name: vibe-template

# Environment of the app and migrate containers. packages/backend/.env (env_file) gives the rest
# (APP_KEY, AI and OAuth keys, VAPID, limits); these values win over it, because inside the
# compose network the services have their own host names and container ports, and the app is
# served from one origin, http://localhost:APP_PORT. Same as scripts/prod-local.sh: plain http,
# so APP_ENV=local (non-secure cookies, ws://) and not production-like.
x-app-environment: &app-environment
    APP_ENV: local
    APP_IS_PRODUCTION: 'false'
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3000'
    APP_UNIX_PATH: ''
    APP_URL: http://localhost:${APP_PORT:-3000}
    FRONTEND_URL: http://localhost:${APP_PORT:-3000}
    LANDING_URL: http://localhost:${APP_PORT:-3000}
    DOMAIN: localhost:${APP_PORT:-3000}
    SERVE_STATIC: 'true'
    DOC_PAGE: 'false'
    # Empty → derived from APP_URL / FRONTEND_URL / DOMAIN above, not from a host-dev .env value.
    CSRF_ALLOWED_ORIGINS: ''
    CSP_API_ORIGIN: ''
    CSP_WS_ORIGIN: ''
    SESSION_COOKIE_HOST_PREFIX: 'false'
    TRUST_PROXY: 'false'
    PGSQL_HOST: postgres
    PGSQL_PORT: '5432'
    PGSQL_SSL: 'false'
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    # The same credentials and bucket as the s3 service. The app writes through the compose
    # network; the browser reads public files from the host port.
    S3_ENDPOINT: http://s3:8333
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-devaccesskey}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devsecretkey}
    S3_BUCKET: ${S3_BUCKET:-vibe-template}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_PREFIX: ${S3_PREFIX:-app}
    CDN_URL: http://localhost:${S3_HOST_PORT:-8333}/${S3_BUCKET:-vibe-template}
    SMTP_ENABLED: 'true'
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    SMTP_SECURE: 'false'
    SMTP_REQUIRE_TLS: 'false'
    SMTP_IGNORE_TLS: 'true'
    SMTP_USER: ''
    SMTP_PASSWORD: ''
    SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.com}

services:
    postgres:
        # The stock postgres image has no pgvector, and the schema needs the `vector` type.
        # The database itself and the extension are made by `pnpm --filter backend db:create`.
        image: pgvector/pgvector:pg16
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${PGSQL_USER:-postgres}
            POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-postgres}
        ports:
            - '127.0.0.1:${PGSQL_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}"']
            interval: 5s
            timeout: 3s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # REDIS_PASSWORD empty (as in .env.example) → no password; set → requirepass.
        command: ['sh', '-c', 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}']
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDISCLI_AUTH: ${REDIS_PASSWORD:-}
        ports:
            - '127.0.0.1:${REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
            interval: 5s
            timeout: 3s
            retries: 10

    s3:
        # S3 for avatars and knowledge-base screenshots: SeaweedFS in single-process `mini` mode
        # (MinIO no longer publishes community images). The credentials are S3_ACCESS_KEY_ID /
        # S3_SECRET_ACCESS_KEY; the bucket S3_BUCKET is made on start. Anonymous reads are allowed
        # only under S3_BUCKET/S3_PREFIX/, because the browser loads avatars and screenshots
        # from CDN_URL; everything else in the bucket needs the key.
        image: chrislusf/seaweedfs:4.50
        restart: unless-stopped
        environment:
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-devaccesskey}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devsecretkey}
            S3_BUCKET: ${S3_BUCKET:-vibe-template}
            S3_PREFIX: ${S3_PREFIX:-app}
        entrypoint:
            - sh
            - -c
            - |
                set -e
                printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Write","Tagging"]},{"name":"anonymous","actions":["Read:%s/%s/*"]}]}' \
                    "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" "$$S3_BUCKET" "$$S3_PREFIX" > /tmp/s3.json
                exec weed mini -dir=/data -s3.config=/tmp/s3.json -bucket="$$S3_BUCKET"
        ports:
            - '127.0.0.1:${S3_HOST_PORT:-8333}:8333'
        volumes:
            - s3-data:/data
        healthcheck:
            test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8333/healthz']
            interval: 5s
            timeout: 3s
            retries: 20

    mailpit:
        # Catches every outgoing mail (verification, password reset). Web UI: http://localhost:8025
        image: axllent/mailpit:v1.31.1
        restart: unless-stopped
        ports:
            - '127.0.0.1:${SMTP_PORT:-1025}:1025'
            - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

    # --- The application (profile `app`): `pnpm app:build`, then `pnpm app:up` ---
    # One-shot schema step before the app, as the Dockerfile asks for (not run on app start).
    migrate:
        profiles: [app]
        image: ${APP_IMAGE:-vibe-template:local}
        pull_policy: never
        env_file: packages/backend/.env
        environment: *app-environment
        command: ['sh', '-c', 'pnpm db:create:prod && pnpm db:migrate']
        restart: 'no'
        depends_on:
            postgres:
                condition: service_healthy

    app:
        profiles: [app]
        image: ${APP_IMAGE:-vibe-template:local}
        pull_policy: never
        restart: unless-stopped
        env_file: packages/backend/.env
        environment: *app-environment
        ports:
            - '127.0.0.1:${APP_PORT:-3000}:3000'
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            s3:
                condition: service_healthy
            mailpit:
                condition: service_started
        # The image HEALTHCHECK (/api/ready: PostgreSQL and Redis answer) is what `up --wait` waits for.

volumes:
    postgres-data:
    redis-data:
    s3-data:
