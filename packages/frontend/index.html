<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <!-- Primary SEO Meta Tags -->
        <title>%PRODUCT_TITLE%</title>
        <meta name="title" content="%PRODUCT_TITLE%" />
        <meta name="description" content="%PRODUCT_DESCRIPTION%" />
        <meta
            name="keywords"
            content="vue 3 template, typescript template, educational project template, full-stack template, pnpm workspace, vite template, backend template, shared package template, testing template"
        />
        <meta name="robots" content="index, follow" />
        <meta name="author" content="%PRODUCT_NAME%" />
        <link rel="canonical" href="%PRODUCT_SITE_URL%" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="%PRODUCT_NAME%" />
        <meta property="og:title" content="%PRODUCT_TITLE%" />
        <meta property="og:description" content="%PRODUCT_DESCRIPTION%" />
        <meta property="og:url" content="%PRODUCT_SITE_URL%" />
        <meta property="og:image" content="/icons/icon_512x512.png" />
        <meta property="og:locale" content="en_US" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="%PRODUCT_TITLE%" />
        <meta name="twitter:description" content="%PRODUCT_DESCRIPTION%" />
        <meta name="twitter:image" content="/icons/icon_512x512.png" />

        <!-- PWA and Theme Configuration: static OS/browser brand colors, not the in-app selectable theme. -->
        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#4E7FA8" />
        <meta name="theme-color" content="#3D6E97" media="(prefers-color-scheme: dark)" />

        <!-- Apple-specific PWA meta tags -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="%PRODUCT_NAME%" />
        <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120x120.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167x167.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
        <link
            rel="apple-touch-startup-image"
            href="/splash/apple-splash-1290x2796.png"
            media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
        />
        <link
            rel="apple-touch-startup-image"
            href="/splash/apple-splash-1179x2556.png"
            media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
        />
        <link
            rel="apple-touch-startup-image"
            href="/splash/apple-splash-1170x2532.png"
            media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
        />

        <!-- Windows-specific PWA meta tags -->
        <meta name="msapplication-TileColor" content="#4E7FA8" />
        <meta name="msapplication-config" content="/browserconfig.xml" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Structured Data (JSON-LD) -->
        <script type="application/ld+json">
            %PRODUCT_JSON_LD%
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
