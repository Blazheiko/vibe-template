name: CI

# Definition of Done checks for every PR: format, typecheck, lint, unit tests with
# coverage, Playwright e2e on all projects, and the live e2e (the SPA against the real backend,
# PostgreSQL and Redis). No paths filter, so the jobs can be required checks. Redis integration tests stay in redis-tests.yml: vitest.config.ts
# excludes *.redis.test.ts from `pnpm test`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck and the backend/frontend tests import the built shared package.
      - run: pnpm --filter shared build

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Coverage
        run: |
          pnpm --filter backend test:coverage
          pnpm --filter frontend test:coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: |
            packages/backend/coverage/
            packages/frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright's WebKit build cannot start
    # (libicudata.so.74 missing), so every WebKit and Mobile Safari test failed. Chromium and
    # Firefox were fine. Unpin once the Playwright version in use supports the newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter shared build

      # On CI Playwright serves the production build with `vite preview`.
      - run: pnpm --filter frontend build

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter frontend exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # All browsers of playwright.config.ts projects: chromium, firefox, webkit
      # (webkit also runs Mobile Safari). System deps are not cached.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter frontend exec playwright install --with-deps

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter frontend exec playwright install-deps

      - run: pnpm --filter frontend test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 14

  # The SPA served by the real backend with PostgreSQL (pgvector), Redis and a mail sink:
  # what the mocks of the `e2e` job cannot show, e.g. that a password reset in one browser signs
  # another one out (feat-069, G3). The run uses a database and a Redis key prefix of its own.
  e2e-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGSQL_HOST: 127.0.0.1
      PGSQL_PORT: 5432
      PGSQL_USER: postgres
      PGSQL_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      APP_KEY: ci-live-e2e-app-key-0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter frontend exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-live-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium only: the live specs are about the session, not about the engines.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter frontend exec playwright install-deps chromium

      # Builds shared, the SPA (phone auth off, API at http://localhost:3100) and the backend,
      # then Playwright starts the backend with the database made first.
      - run: pnpm --filter frontend test:e2e:live

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-live-report
          path: |
            packages/frontend/playwright-report/
            packages/frontend/test-results/live/
          retention-days: 14
