name: CI

# Definition of Done checks for every PR: format, typecheck, lint, unit tests with
# coverage, and Playwright e2e on all projects. No paths filter, so the jobs can be
# required checks. Redis integration tests stay in redis-tests.yml: vitest.config.ts
# excludes *.redis.test.ts from `pnpm test`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck and the backend/frontend tests import the built shared package.
      - run: pnpm --filter shared build

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Coverage
        run: |
          pnpm --filter backend test:coverage
          pnpm --filter frontend test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            packages/backend/coverage/
            packages/frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright's WebKit build cannot start
    # (libicudata.so.74 missing), so every WebKit and Mobile Safari test failed. Chromium and
    # Firefox were fine. Unpin once the Playwright version in use supports the newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter shared build

      # On CI Playwright serves the production build with `vite preview`.
      - run: pnpm --filter frontend build

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter frontend exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # All browsers of playwright.config.ts projects: chromium, firefox, webkit
      # (webkit also runs Mobile Safari). System deps are not cached.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter frontend exec playwright install --with-deps

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter frontend exec playwright install-deps

      - run: pnpm --filter frontend test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 14
