name: Dependency audit

# feat-207 (L-19): nobody looked at advisories between manual reviews. Once a week (and on
# demand) the production dependency tree is checked against the registry's advisory database.
# The whole report is printed; the job fails on a high or critical advisory. It reads only
# pnpm-lock.yaml, so nothing is installed and no dependency script runs.
on:
    schedule:
        - cron: '17 5 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Full report (does not fail the job)
              run: pnpm audit --prod || true

            - name: High and critical advisories
              run: pnpm audit --prod --audit-level=high
