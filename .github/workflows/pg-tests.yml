name: PG tests

# Integration tests against a real PostgreSQL with pgvector
# (packages/backend/src/**/*.pg.test.ts). The global setup creates a throwaway
# database and applies the migrations; without PG_TEST_URL the suites skip, so
# this job is what actually exercises SQL against the real schema.
# A Redis service runs beside it for the tests that need both (session revocation,
# ADR 0002: sessions in Redis, users.sessionToken in PostgreSQL); they skip without
# REDIS_TEST_URL, and the other suites do not use it.
on:
  pull_request:
    paths: &pg_paths
      - "packages/backend/src/**"
      - "packages/backend/package.json"
      - "packages/backend/vitest*.config.ts"
      - "packages/shared/src/**"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/pg-tests.yml"
  push:
    branches: [main]
    paths: *pg_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter shared build

      - run: pnpm --filter backend test:pg
