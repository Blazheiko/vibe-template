name: Redis tests

# Integration tests against a real Redis (packages/backend/src/**/*.redis.test.ts):
# the shared rate limits and the main client's no-resend / timeout contract.
# Without REDIS_TEST_URL they skip, so this job is what actually exercises the
# Lua scripts and CLIENT PAUSE scenarios.
on:
  pull_request:
    paths: &redis_paths
      - "packages/backend/src/**"
      - "packages/backend/package.json"
      - "packages/backend/vitest*.config.ts"
      - "packages/shared/src/**"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/redis-tests.yml"
  push:
    branches: [main]
    paths: *redis_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redis-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter shared build

      - run: pnpm --filter backend test:redis
